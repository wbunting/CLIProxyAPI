host: "127.0.0.1"
port: 8317

tls:
  enable: false

remote-management:
  allow-remote: false
  secret-key: ""
  disable-control-panel: true
  disable-auto-update-panel: true

auth-dir: "/home/will/.local/state/ai-router/auth"

# Replace before starting the service. Use a distinct key per client when practical.
api-keys:
  - "replace-with-a-long-random-client-key"

debug: false
request-log: false
logging-to-file: false
usage-statistics-enabled: false

discovery:
  enabled: false

plugins:
  enabled: false

